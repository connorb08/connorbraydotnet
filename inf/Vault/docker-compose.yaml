version: '3.8'

name: vault
services:
  vault:
    image: hashicorp/vault:latest
    container_name: vault-prod
    network_mode: service:tailscale
    volumes:
      - ./vault-config.hcl:/vault/config/vault-config.hcl
      - ./vault-data:/vault/data
    cap_add:
      - IPC_LOCK
    command: server -config=/vault/config/vault-config.hcl

  tailscale:
    image: tailscale/tailscale:stable
    hostname: ${TS_HOSTNAME:-vault}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?Set TS_AUTHKEY in .env or the environment}
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: ${TS_HOSTNAME:-vault}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_DEST_IP: 127.0.0.1
    volumes:
      - tailscale-state:/var/lib/tailscale
    restart: unless-stopped

volumes:
  vault-data:
  tailscale-state:
