include = ["./tools.toml"]

[settings]
experimental = true
install_layout = "identity"
# system_packages.managers = ["apt"]
enable_backends = ["aqua", "core", "github", "npm", "go"]


[tool_config]
locked = true


[oci]
user = "1000:1000"
user_id = 1000
group_id = 1000
mount_point = "/mise"
workdir = "/workspace"

# [oci.labels]
# "org.opencontainers.image.source" = "https://github.com/me/my-app"

[[oci.copy]]
host = "files/mise-config.toml"
image = "/config/mise/config.toml"

[[oci.copy]]
host = "files/containers-policy.json"
image = "/etc/containers/policy.json"

